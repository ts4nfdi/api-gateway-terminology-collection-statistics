apiVersion: batch/v1
kind: CronJob
metadata:
  name: ts4nfdi-api-gateway-collection-statistics-cronjob
spec:
  schedule: "0 2 * * 1"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trigger-all-collection-statistics
              image: curlimages/curl:8.12.1

              env:
                - name: PORTAL_KEY
                  valueFrom:
                    secretKeyRef:
                      name: statistics-service-portal-key
                      key: STATISTICS_SERVICE_PORTAL_KEY

              command:
                - curl
                - --fail
                - --show-error
                - --silent
                - -i
                - --write-out
                - "\nDuration: %{time_total}s\n"
                - --max-time
                - "1800"
                - -X
                - POST
                - -H
                - "X-Portal-Key: $(PORTAL_KEY)"
                - http://ts4nfdi-api-gateway-collection-statistics:8000/stats/all
              resources:
                requests:
                  memory: 100Mi
                limits:
                  memory: 250Mi
